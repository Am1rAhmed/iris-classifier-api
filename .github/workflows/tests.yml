name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Train model
        run: |
          python ml/train.py

      - name: Run tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          pytest -v --ignore=tests/test_integration.py --ignore=tests/test_integration_live.py